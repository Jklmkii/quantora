name: Auto Merge Jules PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    name: Test and Auto-Merge Jules PR
    # Dispara apenas quando o autor do PR for a Jules AI (google-jules ou bot associado)
    if: contains(github.event.pull_request.user.login, 'jules') || contains(github.event.pull_request.head.ref, 'jules')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npx vitest run

      - name: Verify Production Build
        run: npm run build

      - name: Auto-Approve and Merge PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --body "Automated approval: Vitest, Oxlint and Build passed with 100% success."
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto --delete-branch
