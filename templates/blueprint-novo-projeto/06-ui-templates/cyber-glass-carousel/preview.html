<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Glass Carousel — UI Template</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #050811;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* 1. Fundo Cósmico com Nebulosa Radial */
    .nebula-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 45%, rgba(28, 11, 54, 0.8) 0%, rgba(5, 8, 17, 0.95) 70%),
        radial-gradient(circle at 15% 20%, rgba(8, 40, 59, 0.5) 0%, transparent 50%),
        radial-gradient(circle at 85% 60%, rgba(40, 10, 48, 0.45) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    canvas#stars {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* 2. Header Superior */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 36px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f2fe, #ec4899);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
    }

    .logo-badge-inner {
      width: 100%;
      height: 100%;
      background: #070b15;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .glass-pill:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(0, 242, 254, 0.4);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .notif-btn {
      width: 44px;
      height: 44px;
      justify-content: center;
      position: relative;
    }

    .notif-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
      box-shadow: 0 0 8px #f43f5e;
    }

    .profile-pill {
      padding: 8px 16px;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #00f2fe;
    }

    /* 3. Main Carousel 3D Deck */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      padding: 20px;
    }

    .deck-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      max-width: 1200px;
      width: 100%;
    }

    .cyber-card {
      width: 360px;
      border-radius: 28px;
      padding: 36px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
    }

    /* Specular Light Highlight no topo de cada card */
    .cyber-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      pointer-events: none;
    }

    /* Estado Inativo */
    .cyber-card.inactive {
      background: rgba(13, 22, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0.45;
      transform: scale(0.9) translateZ(-40px);
    }

    .cyber-card.inactive:hover {
      opacity: 0.75;
      transform: scale(0.93) translateZ(-20px);
    }

    /* Estado Ativo Central */
    .cyber-card.active {
      background: rgba(11, 18, 36, 0.85);
      border: 2px solid #00f2fe;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      opacity: 1;
      transform: scale(1.06) translateZ(20px);
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.32), 0 25px 50px rgba(0, 0, 0, 0.7);
      cursor: default;
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    /* Área Central do Card: Ícone e XP */
    .card-center-stage {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 20px;
    }

    .xp-badge {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .xp-badge.left { left: 10px; }
    .xp-badge.right { right: 10px; }

    .xp-label {
      font-size: 14px;
      font-weight: 900;
      color: #00f2fe;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.8);
    }

    .xp-value {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 1px;
    }

    .icon-box {
      width: 110px;
      height: 110px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .cyber-card.active .icon-box {
      background: rgba(0, 242, 254, 0.08);
      border: 2px solid rgba(0, 242, 254, 0.7);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.35);
    }

    .cyber-card.inactive .icon-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .icon-svg {
      width: 60px;
      height: 60px;
    }

    .glow-cyan {
      filter: drop-shadow(0 0 14px #00f2fe);
    }

    .glow-magenta {
      filter: drop-shadow(0 0 14px #ec4899);
    }

    .card-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-top: 10px;
      max-width: 250px;
    }

    /* Controles do Card Ativo */
    .active-controls {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      margin-top: 24px;
    }

    .cyber-card.active .active-controls {
      display: flex;
    }

    .streak-title {
      font-size: 12px;
      font-weight: 800;
      color: #00f2fe;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-segments {
      display: flex;
      gap: 6px;
      margin-bottom: 22px;
    }

    .seg {
      height: 5px;
      border-radius: 4px;
      background: #1e293b;
    }

    .seg.fill {
      width: 32px;
      background: #00f2fe;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.8);
    }

    .seg.empty {
      width: 16px;
    }

    .continue-btn {
      padding: 12px 36px;
      border-radius: 40px;
      border: none;
      background: linear-gradient(90deg, #00f2fe, #38bdf8);
      color: #020617;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
      transition: all 0.25s ease;
    }

    .continue-btn:hover {
      background: linear-gradient(90deg, #38bdf8, #7dd3fc);
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.9);
    }

    /* 4. Footer Inferior */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 36px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      justify-content: center;
    }

    .timecode-box {
      padding: 8px 14px;
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      color: #00f2fe;
      letter-spacing: 2px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stepper {
      padding: 6px 14px;
      gap: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .step-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: color 0.2s;
    }

    .step-btn:hover {
      color: #00f2fe;
    }

    .step-val {
      color: #ffffff;
      min-width: 20px;
      text-align: center;
    }

    .filter-dropdown {
      padding: 8px 18px;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Fundo Cósmico & Canvas de Constelações -->
  <div class="nebula-bg"></div>
  <canvas id="stars"></canvas>

  <!-- Top Navigation Bar -->
  <header>
    <div class="brand">
      <div class="logo-badge">
        <div class="logo-badge-inner">Q</div>
      </div>
      <div class="brand-title">Quantora</div>
    </div>

    <div class="header-actions">
      <div class="glass-pill notif-btn" title="Notificações">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
        <span class="notif-dot"></span>
      </div>

      <div class="glass-pill profile-pill">
        <div class="avatar-circle">👤</div>
        <span>Quartora</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- Main Deck: Carrossel 3D -->
  <main>
    <div class="deck-container">
      <!-- Card 1: 60s Blitz -->
      <div class="cyber-card inactive" onclick="selectCard(0)" id="card-0">
        <div class="card-title">60s Blitz</div>
        <div class="card-subtitle">Glow glover electred</div>
        
        <div class="card-center-stage">
          <div class="icon-box">
            <!-- Raio Triplo SVG -->
            <svg class="icon-svg glow-cyan" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
          </div>
        </div>

        <div class="card-desc">electrical skarks</div>

        <div class="active-controls">
          <div class="streak-title">BLITZ MODE</div>
          <div class="progress-segments">
            <div class="seg fill"></div>
            <div class="seg empty"></div>
            <div class="seg empty"></div>
          </div>
          <button class="continue-btn" onclick="alert('Iniciando 60s Blitz!')">Continue</button>
        </div>
      </div>

      <!-- Card 2: Survival Mode (Ativo por Padrão) -->
      <div class="cyber-card active" onclick="selectCard(1)" id="card-1">
        <div class="card-title">Survival Mode</div>
        <div class="card-subtitle">Educational Math training</div>
        
        <div class="card-center-stage">
          <div class="xp-badge left">
            <span class="xp-label">XP</span>
            <span class="xp-value">XP</span>
          </div>

          <div class="icon-box">
            <!-- Caveira Neon SVG -->
            <svg class="icon-svg glow-cyan" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="12" r="1.5" fill="#00f2fe"/>
              <circle cx="15" cy="12" r="1.5" fill="#00f2fe"/>
              <path d="M8 20v2h8v-2"/>
              <path d="m12.5 17-.5-1-.5 1h1z" fill="#00f2fe"/>
              <path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/>
            </svg>
          </div>

          <div class="xp-badge right">
            <span class="xp-label">XP</span>
            <span class="xp-value">XP</span>
          </div>
        </div>

        <div class="card-desc">BP Treak Mode</div>

        <div class="active-controls">
          <div class="streak-title">STREAK MODE</div>
          <div class="progress-segments">
            <div class="seg fill"></div>
            <div class="seg empty"></div>
            <div class="seg empty"></div>
          </div>
          <button class="continue-btn" onclick="alert('Iniciando Survival Mode!')">Continue</button>
        </div>
      </div>

      <!-- Card 3: Boss Battle -->
      <div class="cyber-card inactive" onclick="selectCard(2)" id="card-2">
        <div class="card-title">Boss Battle</div>
        <div class="card-subtitle">Chain compaon toarn to</div>
        
        <div class="card-center-stage">
          <div class="icon-box">
            <!-- Espadas Cruzadas SVG -->
            <svg class="icon-svg glow-magenta" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
              <line x1="13" y1="19" x2="19" y2="13"/>
              <line x1="16" y1="16" x2="20" y2="20"/>
              <line x1="19" y1="21" x2="21" y2="19"/>
              <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/>
              <line x1="5" y1="14" x2="9" y2="18"/>
              <line x1="7" y1="17" x2="4" y2="20"/>
              <line x1="3" y1="19" x2="5" y2="21"/>
            </svg>
          </div>
        </div>

        <div class="card-desc">Boss Battle</div>

        <div class="active-controls">
          <div class="streak-title">BOSS FIGHT</div>
          <div class="progress-segments">
            <div class="seg fill"></div>
            <div class="seg empty"></div>
            <div class="seg empty"></div>
          </div>
          <button class="continue-btn" onclick="alert('Desafiando o Chefe!')">Continue</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom HUD: Controles Inferiores -->
  <footer>
    <div class="footer-left">
      <div class="glass-pill back-btn" title="Voltar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
      </div>

      <div class="glass-pill timecode-box">
        03:57.772
      </div>
    </div>

    <div class="footer-right">
      <div class="glass-pill stepper">
        <button class="step-btn" onclick="changeCount(-1)">−</button>
        <span class="step-val" id="count-display">10</span>
        <button class="step-btn" onclick="changeCount(1)">+</button>
      </div>

      <div class="glass-pill filter-dropdown">
        <span>Refined</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>
    </div>
  </footer>

  <!-- Script Interativo: Canvas de Constelações e Seleção 3D de Cards -->
  <script>
    let activeCardIndex = 1;
    let count = 10;

    function selectCard(index) {
      activeCardIndex = index;
      for (let i = 0; i < 3; i++) {
        const card = document.getElementById(`card-${i}`);
        if (i === index) {
          card.classList.remove('inactive');
          card.classList.add('active');
        } else {
          card.classList.remove('active');
          card.classList.add('inactive');
        }
      }
    }

    function changeCount(delta) {
      count = Math.max(1, count + delta);
      document.getElementById('count-display').textContent = count;
    }

    // Navegação por teclado (Setas Esquerda / Direita)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        selectCard((activeCardIndex - 1 + 3) % 3);
      } else if (e.key === 'ArrowRight') {
        selectCard((activeCardIndex + 1) % 3);
      }
    });

    // Animação 60 FPS de Constelações no Canvas
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = Array.from({ length: 50 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      radius: Math.random() * 1.8 + 0.8,
      color: Math.random() > 0.4 ? 'rgba(0, 242, 254, ' : 'rgba(236, 72, 153, ',
      alpha: Math.random() * 0.6 + 0.2
    }));

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        p1.x += p1.vx;
        p1.y += p1.vy;

        if (p1.x < 0) p1.x = width;
        if (p1.x > width) p1.x = 0;
        if (p1.y < 0) p1.y = height;
        if (p1.y > height) p1.y = 0;

        ctx.beginPath();
        ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
        ctx.fillStyle = p1.color + p1.alpha + ')';
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(0, 242, 254, ${(1 - dist / 120) * 0.15})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
